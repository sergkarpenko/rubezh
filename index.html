<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Рубіж — превью</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0d1017;
        color: #d7dde6;
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      /* ADR-0027: топбар — завжди видний; стан партії одним поглядом */
      header#topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid #232a36;
        position: sticky;
        top: 0;
        background: #0d1017;
        z-index: 10;
      }
      h1 {
        font-size: 20px;
        margin: 0;
        letter-spacing: 0.06em;
      }
      .sub {
        color: #7d8794;
        font-size: 12px;
        margin-top: 2px;
      }
      #topbar .chips {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .chip {
        background: #131824;
        border: 1px solid #232a36;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        color: #9aa7b5;
        white-space: nowrap;
      }
      .chip b {
        color: #d7dde6;
        font-variant-numeric: tabular-nums;
      }
      #topbar .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-left: auto;
      }
      /* ADR-0027: сітка «фокусна зона + колонка стану»; журнал — під фокусною */
      main#layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        grid-template-areas:
          'focus status'
          'journal status';
        gap: 16px;
        padding: 16px;
        align-items: start;
      }
      #focus {
        grid-area: focus;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #journal {
        grid-area: journal;
      }
      aside#status {
        grid-area: status;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      /* ADR-0027: двоколонковий каркас до ~900px (iPad Pro 1024/1366), нижче — складання */
      @media (max-width: 899px) {
        main#layout {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            'focus'
            'journal'
            'status';
        }
      }
      section.panel {
        background: #131824;
        border: 1px solid #232a36;
        border-radius: 8px;
        padding: 12px;
      }
      h2 {
        font-size: 12px;
        margin: 0 0 8px;
        color: #9fb0c3;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      button {
        background: #1d2740;
        border: 1px solid #31435f;
        color: #d7e4f7;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.mission {
        background: #3a2f10;
        border-color: #8a6d1d;
      }
      button.armed {
        background: #3a2f10;
        border-color: #8a6d1d;
      }
      input {
        background: #0d1017;
        border: 1px solid #31435f;
        color: inherit;
        border-radius: 6px;
        padding: 4px 8px;
        width: 72px;
        font: inherit;
      }
      canvas {
        display: block;
        background: #0a0d12;
        border-radius: 6px;
      }
      /* ADR-0027: геосцена тягнеться на ширину фокусної колонки */
      #geo {
        width: 100%;
        height: auto;
      }
      .clock {
        font-size: 14px;
        font-weight: 600;
      }
      .ufo {
        margin: 6px 0;
        padding: 8px;
        border: 1px solid #232a36;
        border-radius: 6px;
      }
      .ufo button {
        margin-top: 6px;
      }
      .meta {
        color: #7d8794;
        font-size: 12px;
      }
      .soldier {
        display: flex;
        gap: 10px;
        padding: 3px 0;
        font-variant-numeric: tabular-nums;
      }
      .save-row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 4px 0;
        flex-wrap: wrap;
      }
      .save-row .meta {
        flex: 1 1 100%;
      }
      .save-row button {
        padding: 4px 8px;
        font-size: 12px;
      }
      .kills {
        color: #d8b25a;
      }
      .banner {
        padding: 10px 14px;
        border-radius: 6px;
        font-weight: 600;
        margin: 8px 0;
      }
      .banner.win {
        background: #12301c;
        color: #7fe2a0;
      }
      .banner.lose {
        background: #341418;
        color: #ff9c9c;
      }
      /* ADR-0027: єдиний журнал подій з фільтрами-вкладками */
      #log-tabs {
        display: flex;
        gap: 6px;
        margin: 0 0 8px;
        flex-wrap: wrap;
      }
      #log-tabs button {
        padding: 4px 10px;
        font-size: 12px;
      }
      #log-tabs button.active {
        background: #31435f;
        border-color: #6ea8ff;
      }
      #log {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 420px;
        overflow: auto;
        font-size: 12px;
        color: #9aa7b5;
      }
      #log li {
        padding: 3px 0;
        border-bottom: 1px solid #1a2130;
      }
      #log li.win {
        color: #7fe2a0;
      }
      #log li.lose {
        color: #ff9c9c;
      }
      #binfo {
        color: #9fb0c3;
        font-size: 12px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <div>
        <h1>РУБІЖ</h1>
        <div class="sub">превью · фаза 6a: єдиний каркас (топбар + фокус + стан)</div>
      </div>
      <div class="chips">
        <span class="chip clock" id="clock">—</span>
        <input id="seed" type="number" value="42" title="Сід партії" />
        <span class="chip">Баланс: <b id="money">—</b></span>
        <span class="chip">Боєготові: <b id="ready">—</b></span>
      </div>
      <div class="actions">
        <button id="btn-tick">+1 тік (30 хв)</button>
        <button id="btn-day">+1 доба</button>
        <button id="btn-new">Нова партія</button>
      </div>
    </header>
    <main id="layout">
      <div id="focus">
        <section class="panel" id="geo-panel">
          <h2>Геосцена</h2>
          <canvas id="geo" width="576" height="288"></canvas>
        </section>
        <section class="panel hidden" id="battle-panel">
          <h2>Тактичний бій <span id="bturn" style="color: #7d8794"></span></h2>
          <div id="bresult"></div>
          <div id="binfo" style="margin: 8px 0; min-height: 18px">—</div>
          <div style="display: flex; gap: 8px; margin: 0 0 10px; flex-wrap: wrap">
            <button id="btn-snap" title="3 AP · ×0.8 · 1 куля">Швидкий</button>
            <button id="btn-aimed" title="5 AP · ×1.15 · 1 куля">Прицільний</button>
            <button id="btn-auto" title="4 AP · ×0.5 · 3 кулі">Черга</button>
            <button id="btn-ow" title="3 AP · реакційний вогонь у хід прибульців">Заступа</button>
            <button id="btn-end">Кінець ходу</button>
            <button id="btn-demo" title="Бій дограють боти (демо ітерації P)">Демо-бій</button>
          </div>
          <canvas id="battle" width="520" height="520"></canvas>
        </section>
      </div>
      <section class="panel" id="journal">
        <h2>Журнал</h2>
        <div id="log-tabs">
          <button class="active" data-filter="all" id="log-tab-all">Усе</button>
          <button data-filter="geo" id="log-tab-geo">Геосцена</button>
          <button data-filter="econ" id="log-tab-econ">Економіка</button>
          <button data-filter="battle" id="log-tab-battle">Бій</button>
        </div>
        <ul id="log"></ul>
      </section>
      <aside id="status">
        <section class="panel">
          <h2>Сканери (виявлені НЛО)</h2>
          <div id="ufos"></div>
        </section>
        <section class="panel">
          <h2>Фінанси</h2>
          <div style="margin-bottom: 8px">
            Баланс: <b id="money-card">—</b>
            <span class="meta">· дотація 100/добу · премія за місію</span>
          </div>
          <button id="btn-hire">Найм солдата (100)</button>
        </section>
        <section class="panel">
          <h2>Ростер загону</h2>
          <div id="roster"></div>
        </section>
        <section class="panel">
          <h2>Збереження</h2>
          <div id="save-panel"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
