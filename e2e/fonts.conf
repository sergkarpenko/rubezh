<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  e2e/fonts.conf (Т.171, ADR-0139): шрифт сторінки в e2e однаковий локально і в CI.
  Сторінка задає `system-ui, sans-serif`; Chromium на Linux бере їх у fontconfig, а там
  у контейнері сесії — Inter, на раннері GitHub — за вимірами Т.122 DejaVu Sans. Браузер e2e отримує цей
  файл через FONTCONFIG_FILE (playwright.e2e.config.ts): системні налаштування — як є,
  лише system-ui і sans-serif першим ставлять DejaVu Sans (ширший; monospace не чіпає).
  Гейт — тест «Т.171» у e2e/acceptance.scenario.ts.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
