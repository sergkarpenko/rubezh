# CI-гейт на PR (ADR-0025/0035/0076): типи + лінт + формат + тести + поріг покриття + звіт на Codecov (гейт codecov/patch, ADR-0034) + збірка + docs — без деплою.
# Працює при кожному PR у main; чек «test» — required status check
# для захисту гілки main (той самий рубіж, що й preview на push).
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # ADR-0076: строго за lockfile (урок П9.4 — дрейф node_modules від lockfile)
      - run: npm ci
      # ADR-0076: гейти типів, лінту і формату — у CI, а не лише в pre-commit.
      # tsc перевіряє і тестові файли: vitest типи не перевіряє, typedoc тести виключає.
      - run: npx tsc --noEmit
      # ADR-0079: ядро компілюється без lib.dom — «чисте ядро без DOM» (ADR-0002) як гейт
      - run: npx tsc --noEmit -p tsconfig.core.json
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Покриття ядра + поріг 80% (ADR-0017); звіт — dist/coverage
      - run: npm run test:coverage
      # ADR-0035: звіт на Codecov у PR — джерело даних для гейта codecov/patch (ADR-0034,
      # target 95% з codecov.yml); без цього кроку чек висить «Waiting» і блокує мердж.
      # Той самий крок і токен, що й у preview.yml (П3.1); Codecov дедуплікує за SHA.
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          files: dist/coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: npm run build
      # TypeDoc-довідка (ADR-0019) — перевірка генерації на PR
      - run: npm run docs
