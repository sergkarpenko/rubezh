# CI-гейт на PR (ADR-0025/0035/0076): типи + лінт + формат + тести + поріг покриття + звіт на Codecov (гейт codecov/patch, ADR-0034) + збірка + docs — без деплою.
# Джоба «e2e» (ADR-0080): сценарій приймання в браузері.
# ADR-0146: обсяг перевірок — за зміненими файлами (scripts/ci-scope.sh): docs — без
# тестів, лінту і збірки; tools (scripts/, кореневі *.md) — tsc скриптів, лінт, формат;
# full — усе. Джоби стартують завжди (обов'язкові чеки зеленіють), зайві кроки пропущено.
# Джоба «shuffle» (ADR-0128): npm test у перемішаному порядку; обов'язковий чек main (ADR-0131).
# Працює при кожному PR у main; чек «test» — required status check
# для захисту гілки main (той самий рубіж, що й preview на push).
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ADR-0113: кожен крок run: — під bash з pipefail (bash --noprofile --norc -eo pipefail);
# без цього рядка крок іде під bash -e, і код першої команди конвеєра губиться.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-коміт PR і його батьки: HEAD^1 — база, диф HEAD^1..HEAD — зміни PR
          fetch-depth: 2
      # ADR-0146: помилка скрипта — червона джоба, а не пропуск перевірок
      - name: Самоперевірка скрипта обсягу
        run: sh scripts/ci-scope.sh --self-test
      - name: Обсяг перевірок
        id: scope
        run: sh scripts/ci-scope.sh HEAD^1 HEAD >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.level != 'docs'
        with:
          node-version: 26
      # ADR-0076: строго за lockfile (урок П9.4 — дрейф node_modules від lockfile)
      - run: npm ci
        if: steps.scope.outputs.level != 'docs'
      # ADR-0113: кожен workflow задає defaults.run.shell: bash (pipefail) — новий workflow
      # без цього блоку червонить чек test
      - name: Workflow — bash з pipefail
        run: |
          shopt -s nullglob
          # grep -L: код 0 або 1 — норма (залежить від версії grep), 2 — помилка читання
          rc=0
          missing="$(grep -L -x -F -e '    shell: bash' .github/workflows/*.yml .github/workflows/*.yaml)" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::grep: код $rc (ADR-0113)"; exit 2; fi
          if [ -n "$missing" ]; then
            for f in $missing; do echo "::error file=$f::немає defaults.run.shell: bash (ADR-0113)"; done
            exit 1
          fi
      # ADR-0076: гейти типів, лінту і формату — у CI, а не лише в pre-commit.
      # tsc перевіряє і тестові файли: vitest типи не перевіряє, typedoc тести виключає.
      - run: npx tsc --noEmit
        if: steps.scope.outputs.level == 'full'
      # ADR-0079: ядро компілюється без lib.dom — «чисте ядро без DOM» (ADR-0002) як гейт
      - run: npx tsc --noEmit -p tsconfig.core.json
        if: steps.scope.outputs.level == 'full'
      # ADR-0106, ADR-0140, ADR-0141: scripts/*.ts, кореневі playwright*.config.ts і
      # e2e/smoke.e2e.ts — під tsc з типами Node (@types/node; охоплення — tsconfig.scripts.json)
      - run: npx tsc --noEmit -p tsconfig.scripts.json
        if: steps.scope.outputs.level != 'docs'
      - run: npm run lint
        if: steps.scope.outputs.level != 'docs'
      - run: npm run format:check
        if: steps.scope.outputs.level != 'docs'
      # Усі тести з покриттям ядра + поріг 80% (ADR-0017); звіт — dist/coverage.
      # Окремого кроку npm test немає (ADR-0146): це той самий прогін без покриття.
      - run: npm run test:coverage
        if: steps.scope.outputs.level == 'full'
      # ADR-0035: звіт на Codecov у PR — джерело даних для гейта codecov/patch (ADR-0034,
      # target 95% з codecov.yml); без цього кроку чек висить «Waiting» і блокує мердж.
      # Той самий крок і токен, що й у preview.yml (П3.1); Codecov дедуплікує за SHA.
      - name: Codecov
        if: steps.scope.outputs.level == 'full'
        uses: codecov/codecov-action@v7
        with:
          files: dist/coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
      # ADR-0146: без тестів звіту немає — порожнє завантаження закриває codecov/patch зеленим
      - name: Codecov — без звіту
        if: steps.scope.outputs.level != 'full'
        uses: codecov/codecov-action@v7
        with:
          run_command: empty-upload
          force: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: npm run build
        if: steps.scope.outputs.level == 'full'
      # TypeDoc-довідка (ADR-0019) — перевірка генерації на PR
      - run: npm run docs
        if: steps.scope.outputs.level == 'full'

  # ADR-0128: тести в перемішаному порядку (--sequence.shuffle) — ловить тести, що
  # залежать від порядку (стаби без повернення, фейк-таймери — Т.149, Т.150). Окрема
  # джоба; з ADR-0131 (Т.155) — обов'язковий чек main: червона джоба блокує мерж.
  # Сід — з номера прогону: новий пуш — новий порядок, «Re-run» — той самий.
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Обсяг перевірок
        id: scope
        run: sh scripts/ci-scope.sh HEAD^1 HEAD >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.level == 'full'
        with:
          node-version: 26
      - run: npm ci
        if: steps.scope.outputs.level == 'full'
      - name: npm test у перемішаному порядку
        if: steps.scope.outputs.level == 'full'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          seed=$(( RUN_ID % 1000000 ))
          echo "Сід перемішування: $seed"
          echo "Відтворити локально: npx vitest run --sequence.shuffle --sequence.seed=$seed"
          echo "### Shuffle: сід $seed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npx vitest run --sequence.shuffle --sequence.seed=$seed\`" >> "$GITHUB_STEP_SUMMARY"
          npx vitest run --sequence.shuffle --sequence.seed="$seed"

  # ADR-0080: сценарій приймання — smoke-сценарій ADR-0030 у браузері проти збірки
  # цього ж коміту (vite build + vite preview піднімає сам Playwright), звірка
  # сторінки з дзеркалом ядра. Окрема джоба: встановлення браузера (~1 хв) не
  # гальмує чек «test». Чек «e2e» — required status check гілки main (ADR-0082).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Обсяг перевірок
        id: scope
        run: sh scripts/ci-scope.sh HEAD^1 HEAD >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.level == 'full'
        with:
          node-version: 26
      - run: npm ci
        if: steps.scope.outputs.level == 'full'
      # Типи сценарію і дзеркала: Playwright, як і vitest, типів не перевіряє
      - run: npx tsc --noEmit -p tsconfig.e2e.json
        if: steps.scope.outputs.level == 'full'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.level == 'full'
      - run: npm run test:e2e
        if: steps.scope.outputs.level == 'full'
