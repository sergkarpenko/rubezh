# Демо-превью і TypeDoc-довідка на GitHub Pages: тести → збірка Vite → docs → деплой.
# Працює при кожному пуші в main. Якщо деплой не проходить:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
name: preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      # Покриття ядра + поріг 80% (ADR-0017); звіт — dist/coverage
      - run: npm run test:coverage
      # Завантаження на Codecov: невдача = червоний CI (CODECOV_TOKEN налаштовано, П3.1)
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          files: dist/coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: npm run build
      # TypeDoc-довідка API у dist/api (ADR-0019): обов'язково після vite build —
      # той очищає dist/; потрапляє в той самий Pages-артефакт (URL: /api/)
      - run: npm run docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
